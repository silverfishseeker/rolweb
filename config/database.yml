default: &default
  adapter: postgresql
  encoding: unicode
  host: db
  user: postgres
  database: postgres
  password: postgres
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default

production:
  url: <%= ENV["DATABASE_URL"] %>
  user: <%= ENV["DATABASE_USER"] %>
  database: <%= ENV["DATABASE_DATABASE"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


